name: Terraform CI/CD

on:
  push:
    branches:
      - 'features/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # =========================
  # TERRAFORM PLAN
  # =========================
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "d8a6ee4b-f5c4-46cb-b8d2-0b47c9e59fd4",
              "clientSecret": "U528Q~jjXz8DsbcjD_qWjBXBSK3qQH6tBIUefcRM",
              "subscriptionId": "80251667-dec6-4878-8c0c-2e74fbd09aff",
              "tenantId": "63266205-65be-40b5-84bb-5f9624dff5ab"
            }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: Environments/sandbox
        run: terraform init

      - name: Terraform Validate
        working-directory: Environments/sandbox
        run: terraform validate

      - name: Terraform Plan
        working-directory: Environments/sandbox
        run: terraform plan -input=false -var-file="terraform.tfvars"

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "d8a6ee4b-f5c4-46cb-b8d2-0b47c9e59fd4",
              "clientSecret": "U528Q~jjXz8DsbcjD_qWjBXBSK3qQH6tBIUefcRM",
              "subscriptionId": "80251667-dec6-4878-8c0c-2e74fbd09aff",
              "tenantId": "63266205-65be-40b5-84bb-5f9624dff5ab"
            }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: Environments/sandbox
        run: terraform init

      - name: Terraform Apply
        working-directory: Environments/sandbox
        run: terraform apply -auto-approve -input=false -var-file="terraform.tfvars"